<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <link id="favicon" rel="icon" type="image/png" href="/Icon-Dark.png" />

  <script>
    const darkMode = window.matchMedia("(prefers-color-scheme: dark)");
    const favicon = document.getElementById("favicon");

    function updateFavicon(event) {
      favicon.href = event.matches
        ? "/Icon-Light.png"
        : "/Icon-Dark.png";
    }

    updateFavicon(darkMode);

    darkMode.addEventListener("change", updateFavicon);
  </script>

  <title>DeMoviefy</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
